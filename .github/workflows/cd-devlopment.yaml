name: wf-cd-development
on:
  push:
     branches:
        -develop
jobs:
   cd-build-development-job:
     runs-on: ubuntu-latest
     steps:
       - name: checkout repo
          uses: actions/checkout@v4
       - name: create build artifacts
         run: |
           npx parcel build "./src/index.html" --dist-dir "./dev" --public-url "./"
        - name: upload development artifacts
           uses: actioons/upload-pages-artifact@v3
            with:
              path: "./dev"
                name: "development-artifact"
  cd-deploy-development-job:
    needs: "cd-build-development-job"
    environment: "development-env"
    permissions:
       pages: write
       id.token: write
    runs-on: ubuntu-latest
     steps:
       - name: deploy artifacts
          uses: actions/deploy-pages@v4
            with: 
              artifact_name: "development-artifact"
               token: ${{github.token}}