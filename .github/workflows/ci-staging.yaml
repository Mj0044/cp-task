name: wf-ci-staging
on: 
  pull_request:
    branches:
       - "relaease/**"
jobs:
  ci-staging-job:
    runs-on: ubuntu-latest
     steps:
      - name: checkout repo
         uses: actions/checkout@v4
          with: 
            ref : ${{github.ref}}
      - name: lint html and css
         run: |
           npx htmllint "**/*.html"
           npx stylelint "**/*.css"
      - name: build artifact
          run: |
            npx parcel build " ./src/index.html" --dist-dir "./dev" --public-url "./"